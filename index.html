<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Maps 路線規劃 (最快與最短)</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f4f7f6;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            width: 100%;
            max-width: 1200px;
            display: flex;
            gap: 20px;
        }
        .panel {
            flex: 1;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .map-container {
            flex: 2;
            background: white;
            padding: 10px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        #map {
            width: 100%;
            height: 600px;
            border-radius: 4px;
        }
        .input-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #333;
        }
        input[type="text"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #4285F4;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        button:hover {
            background-color: #3367D6;
        }
        .route-card {
            margin-top: 20px;
            padding: 15px;
            background: #fdfdfd;
            border: 1px solid #eee;
            border-radius: 6px;
        }
        .route-card h3 {
            margin-top: 0;
        }
        .tolls-list {
            color: #d32f2f;
            background: #ffebee;
            padding: 10px 20px;
            border-radius: 4px;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <h2 style="text-align: center; color: #333;">智能路線規劃系統 (最快 / 最短)</h2>
    
    <div class="container">
        <!-- 控制面板 -->
        <div class="panel">
            <div class="input-group">
                <label>上車地點 (起點)：</label>
                <input type="text" id="origin" placeholder="例如: 旺角">
            </div>
            <div class="input-group">
                <label>中途站 (可選)：</label>
                <input type="text" id="waypoint" placeholder="例如: 尖沙咀">
            </div>
            <div class="input-group">
                <label>落車地點 (終點)：</label>
                <input type="text" id="destination" placeholder="例如: 銅鑼灣">
            </div>
            <button onclick="calculateRoute()">規劃路線</button>

            <div id="output">
                <!-- 路線結果會顯示在這裡 -->
            </div>
        </div>

        <!-- 地圖 -->
        <div class="map-container">
            <div id="map"></div>
        </div>
    </div>

    <script>
        let map;
        let directionsService;
        let renderers = [];

        // 初始化地圖
        function initMap() {
            map = new google.maps.Map(document.getElementById('map'), {
                center: { lat: 22.3193, lng: 114.1694 }, // 預設中心點為香港
                zoom: 12
            });
            directionsService = new google.maps.DirectionsService();
        }

        // 規劃路線功能
        function calculateRoute() {
            const origin = document.getElementById('origin').value;
            const waypoint = document.getElementById('waypoint').value;
            const destination = document.getElementById('destination').value;

            if (!origin || !destination) {
                alert("請輸入上車及落車地點！");
                return;
            }

            const waypoints = [];
            if (waypoint.trim() !== "") {
                waypoints.push({
                    location: waypoint,
                    stopover: true
                });
            }

            const request = {
                origin: origin,
                destination: destination,
                waypoints: waypoints,
                travelMode: 'DRIVING',
                provideRouteAlternatives: true // 要求提供多條替代路線
            };

            directionsService.route(request, (result, status) => {
                if (status === 'OK') {
                    processRoutes(result);
                } else {
                    alert("無法規劃路線，原因：" + status);
                }
            });
        }

        // 分析與篩選路線
        function processRoutes(result) {
            // 清除之前的路線
            renderers.forEach(r => r.setMap(null));
            renderers = [];
            document.getElementById('output').innerHTML = '';

            // 整理每一條路線的數據
            const routesData = result.routes.map((route, index) => {
                let totalDist = 0;
                let totalDur = 0;
                let tolls = new Set();

                // 計算總距離與時間，並精準抽取收費路段
                route.legs.forEach(leg => {
                    totalDist += leg.distance.value;
                    totalDur += leg.duration.value;

                    leg.steps.forEach(step => {
                        // 檢查導航指示中是否包含 "收費" 或 "Toll"
                        if (step.instructions.includes("收費") || step.instructions.toLowerCase().includes("toll")) {
                            // 移除 HTML 標籤（如 <b>），只保留純文字路名指示
                            let cleanText = step.instructions.replace(/<[^>]*>?/gm, '').trim();
                            tolls.add(cleanText);
                        }
                    });
                });

                return {
                    originalRoute: route,
                    index: index,
                    distanceValue: totalDist,
                    distanceText: (totalDist / 1000).toFixed(1) + " 公里",
                    durationValue: totalDur,
                    durationText: Math.round(totalDur / 60) + " 分鐘",
                    tolls: Array.from(tolls)
                };
            });

            // 尋找最快路線 (時間最短)
            const sortedByTime = [...routesData].sort((a, b) => a.durationValue - b.durationValue);
            const fastestRoute = sortedByTime[0];

            // 尋找最短路線 (距離最短)
            const sortedByDistance = [...routesData].sort((a, b) => a.distanceValue - b.distanceValue);
            const shortestRoute = sortedByDistance[0];

            const selectedRoutes = [];
            
            // 加入最快路線
            fastestRoute.label = "最快路線";
            fastestRoute.color = "#4285F4"; // 藍色
            selectedRoutes.push(fastestRoute);

            // 如果最短路線與最快路線不是同一條，則同時加入並顯示 (最多兩條)
            if (shortestRoute.index !== fastestRoute.index) {
                shortestRoute.label = "最短路線";
                shortestRoute.color = "#EA4335"; // 紅色
                selectedRoutes.push(shortestRoute);
            } else {
                fastestRoute.label = "最佳路線 (同時是最快及最短)";
            }

            // 在地圖及介面上顯示結果
            selectedRoutes.forEach(routeData => {
                // 在地圖畫出路線
                const renderer = new google.maps.DirectionsRenderer({
                    map: map,
                    directions: result,
                    routeIndex: routeData.index,
                    polylineOptions: {
                        strokeColor: routeData.color,
                        strokeOpacity: 0.8,
                        strokeWeight: 6
                    }
                });
                renderers.push(renderer);

                // 生成收費路段的 HTML
                let tollHtml = '<p style="color: #4CAF50; font-weight: bold;">✔️ 此路線無收費路段</p>';
                if (routeData.tolls.length > 0) {
                    tollHtml = `<ul class="tolls-list"><li>${routeData.tolls.join('</li><li>')}</li></ul>`;
                }

                // 在面板顯示詳細資訊
                document.getElementById('output').innerHTML += `
                    <div class="route-card" style="border-left: 6px solid ${routeData.color}">
                        <h3 style="color: ${routeData.color}">${routeData.label}</h3>
                        <p><strong>⏱️ 預計時間：</strong>${routeData.durationText}</p>
                        <p><strong>📏 總距離：</strong>${routeData.distanceText}</p>
                        <p><strong>💰 途經收費路段：</strong></p>
                        ${tollHtml}
                    </div>
                `;
            });
        }
    </script>

    <!-- 請將 YOUR_API_KEY 替換為你的 Google Maps API Key -->
    <script async defer src="https://maps.googleapis.com/maps/api/js?key=AIzaSyA_96kRHBq2ydwohDfpmUhdDNIPOgZQSL0&language=zh-HK&callback=initMap"></script>
</body>
</html>
