    <script>
        // ============================================
        // 全局變數

        let selectedMinFare = 0;
        let currentBaseFare = 0;
        let currentTunnelFee = 0;
        let selectedFareMode = '';
        let currentVerificationCode = '';
        let whatsappSent = false;
        let map = null;
        let directionsService = null;
        let directionsRenderer = null;
        let routesData = [];
        let currentStopCount = 0;
        let bookingMode = 'scheduled';
        const INTERNAL_CODE = '888888';

        // ============================================
        // 車款資料
        // ============================================
        const carData = [
            { name: '豐田混能的士', seats: '4 座位', surcharge: 0, minFare: 100, image: 'comf.jpeg', nameEn: 'Toyota Hybrid Taxi' },
            { name: 'MAXUS MIFA 7', seats: '6 座位', surcharge: 50, minFare: 130, image: 'm7.jpeg', nameEn: 'MAXUS MIFA 7' },
            { name: '廣汽 E9', seats: '6 座位', surcharge: 100, minFare: 180, image: 'e9.jpeg', nameEn: 'GAC E9' },
            { name: '吉利大黃蜂', seats: '6 座位', surcharge: 80, minFare: 160, image: 'bee.jpeg', nameEn: 'Geely Bumblebee' },
            { name: '豐田 NOAH 輪椅的士', seats: '無障礙', surcharge: 150, minFare: 230, image: 'NOAH.jpeg', nameEn: 'Toyota NOAH Wheelchair Taxi' }
        ];

        // ============================================
        // 頁面切換
        // ============================================
        function goToPage(pageNum) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById('page-' + pageNum).classList.add('active');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function resetAll() {
            goToPage(1);
            document.getElementById('booking-success-message').classList.add('hidden');
            document.getElementById('booking-error-message').classList.add('hidden');
        }

        // ============================================
        // 中途站
        // ============================================
        function addStopoverField() {
            if (currentStopCount < 3) {
                currentStopCount++;
                document.getElementById(`stopover-container-${currentStopCount}`).classList.remove('hidden');
            }
        }

        function removeStopoverField(index) {
            document.getElementById(`stopover-container-${index}`).classList.add('hidden');
            document.getElementById(`calc-stopover-${index}`).value = '';
            currentStopCount = Math.max(0, currentStopCount - 1);
        }

        // ============================================
        // 車費計算（完整版）
        // ============================================
        function calculateTaxiBaseFare(km) {
            if (km <= 0) return 0;
            if (km <= 2) return 29;
            let fare = 29;
            let remainingKm = km - 2;
            if (remainingKm <= 7) {
                let jumps = Math.ceil((remainingKm * 1000) / 200);
                fare += jumps * 2.1;
            } else {
                fare += 35 * 2.1;
                let tier2Km = remainingKm - 7;
                let jumps = Math.ceil((tier2Km * 1000) / 200);
                fare += jumps * 1.4;
            }
            return Math.round(fare);
        }

        const tunnelDatabase = [
            { name: "紅隧", fee: 50, lat: 22.2896118, lng: 114.1823943, radius: 300 },
            { name: "東隧", fee: 50, lat: 22.294889, lng: 114.22223, radius: 300 },
            { name: "西隧", fee: 50, lat: 22.2940599, lng: 114.150204, radius: 300 },
            { name: "大欖隧道", fee: 28, lat: 22.3953506, lng: 114.0615077, radius: 500 },
            { name: "城門隧道", fee: 8, lat: 22.3764988, lng: 114.1487468, radius: 300 },
            { name: "香港仔隧道", fee: 8, lat: 22.2614503, lng: 114.1799975, radius: 300 },
            { name: "大老山隧道", fee: 20, lat: 22.368694, lng: 114.212944, radius: 500 },
            { name: "獅子山隧道", fee: 8, lat: 22.3527046, lng: 114.1764997, radius: 300 },
            { name: "尖山隧道", fee: 8, lat: 22.3523498, lng: 114.159581, radius: 200 }
        ];

        function checkTunnelsForRoute(route) {
            let matchedTunnels = [];
            let totalTunnelFee = 0;
            if (!window.google || !google.maps.geometry) return { matchedTunnels, totalTunnelFee };
            
            let allPoints = [];
            if (route.overview_path) allPoints = allPoints.concat(route.overview_path);
            if (route.legs) {
                route.legs.forEach(leg => {
                    if (leg.steps) {
                        leg.steps.forEach(step => {
                            if (step.path) allPoints = allPoints.concat(step.path);
                        });
                    }
                });
            }
            
            tunnelDatabase.forEach(tunnel => {
                let tunnelLatLng = new google.maps.LatLng(tunnel.lat, tunnel.lng);
                let triggered = false;
                for (let i = 0; i < allPoints.length; i++) {
                    let distance = google.maps.geometry.spherical.computeDistanceBetween(allPoints[i], tunnelLatLng);
                    if (distance <= tunnel.radius) { triggered = true; break; }
                }
                if (triggered) {
                    matchedTunnels.push(tunnel);
                    totalTunnelFee += tunnel.fee;
                }
            });
            return { matchedTunnels, totalTunnelFee };
        }

        function calculateFareWithGoogle() {
            const pickup = document.getElementById('calc-pickup').value.trim();
            const dropoff = document.getElementById('calc-dropoff').value.trim();
            
            if (!pickup || !dropoff) {
                alert('請先輸入起點及目的地！');
                return;
            }
            
            if (!directionsService) directionsService = new google.maps.DirectionsService();
            
            let stopoverTexts = [];
            for (let i = 1; i <= 3; i++) {
                const stopVal = document.getElementById(`calc-stopover-${i}`)?.value.trim();
                if (stopVal) stopoverTexts.push(stopVal);
            }
            
            let waypoints = stopoverTexts.map(s => ({ location: s, stopover: true }));
            
            const request = {
                origin: pickup,
                destination: dropoff,
                waypoints: waypoints,
                travelMode: google.maps.TravelMode.DRIVING,
                provideRouteAlternatives: true
            };
            
            directionsService.route(request, (result, status) => {
                if (status === google.maps.DirectionsStatus.OK) {
                    routesData = result.routes;
                    
                    document.getElementById('confirm-pickup').textContent = pickup;
                    document.getElementById('confirm-dropoff').textContent = dropoff;
                    
                    if (stopoverTexts.length > 0) {
                        document.getElementById('confirm-stopover-wrapper').classList.remove('hidden');
                        document.getElementById('confirm-stopover').textContent = stopoverTexts.join(' ➔ ');
                    }
                    
                    displaySelectedRoute(result, 0);
                    goToPage(2);
                } else {
                    alert('無法計算路線，請檢查輸入的地點');
                }
            });
        }

        function displaySelectedRoute(directionsResult, routeIndex) {
            if (!map) {
                map = new google.maps.Map(document.getElementById('map'), {
                    zoom: 12,
                    center: { lat: 22.3193, lng: 114.1694 },
                    disableDefaultUI: true,
                    zoomControl: true
                });
            }
            if (!directionsRenderer) {
                directionsRenderer = new google.maps.DirectionsRenderer({
                    map: map,
                    polylineOptions: { strokeColor: '#FFF200', strokeWeight: 5, strokeOpacity: 0.9 }
                });
            }
            
            directionsRenderer.setDirections(directionsResult);
            directionsRenderer.setRouteIndex(routeIndex);
            
            const selectedRoute = directionsResult.routes[routeIndex];
            let totalMeters = 0, totalSeconds = 0;
            selectedRoute.legs.forEach(leg => {
                totalMeters += leg.distance.value;
                totalSeconds += leg.duration.value;
            });
            
            let routeKm = totalMeters / 1000;
            let durationMinutes = Math.round(totalSeconds / 60);
            let baseMeterFare = calculateTaxiBaseFare(routeKm);
            let tunnelResult = checkTunnelsForRoute(selectedRoute);
            
            currentBaseFare = baseMeterFare;
            currentTunnelFee = tunnelResult.totalTunnelFee;
            
            document.getElementById('res-distance').textContent = routeKm.toFixed(1) + ' km';
            document.getElementById('res-duration').textContent = durationMinutes + ' 分鐘';
            document.getElementById('res-total-fare').textContent = 'HK$ ' + (baseMeterFare + tunnelResult.totalTunnelFee);
            
            if (tunnelResult.matchedTunnels.length > 0) {
                document.getElementById('detected-tunnels-container').classList.remove('hidden');
                document.getElementById('detected-tunnels-list').textContent = 
                    tunnelResult.matchedTunnels.map(t => `${t.name} ($${t.fee})`).join('、');
            }
            
            renderCarList();
            updateFareModeDisplay();
        }

        // ============================================
        // 車款列表
        // ============================================
        function renderCarList() {
            const container = document.getElementById('car-list');
            container.innerHTML = '';
            
            carData.forEach(car => {
                let displayFare = currentBaseFare + currentTunnelFee + car.surcharge;
                if (displayFare < car.minFare) displayFare = car.minFare;
                
                const card = document.createElement('div');
                card.className = `bg-brand-card border ${selectedCar === car.name ? 'car-card-selected' : 'border-gray-800'} rounded-xl p-3 cursor-pointer`;
                card.onclick = () => selectCar(car);
                card.innerHTML = `
                    <div class="flex items-center gap-3">
                        <img src="${car.image}" alt="${car.name}" class="w-14 h-14 object-contain rounded-lg bg-black/50 p-1" onerror="this.src='https://via.placeholder.com/56x56/000/fff?text=Taxi'">
                        <div class="flex-1">
                            <p class="text-sm font-bold text-white">${currentLang === 'en' ? car.nameEn : car.name}</p>
                            <p class="text-xs text-gray-400">${car.seats}</p>
                            <p class="text-brand-yellow font-bold text-sm">HK$ ${displayFare}</p>
                        </div>
                        ${selectedCar === car.name ? '<i class="fa-solid fa-check-circle text-brand-yellow text-xl"></i>' : ''}
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function selectCar(car) {
            selectedCar = car.name;
            selectedSurcharge = car.surcharge;
            selectedMinFare = car.minFare;
            renderCarList();
            
            const fareModeBox = document.getElementById('fare-mode-box');
            if (car.name === '豐田混能的士') {
                fareModeBox.classList.remove('hidden');
            } else {
                fareModeBox.classList.add('hidden');
                selectedFareMode = 'normal';
                document.getElementById('fare-mode-normal').checked = true;
                document.getElementById('fare-mode-discount').checked = false;
            }
        }

        function handleFareModeSelection(mode) {
            const normalCheckbox = document.getElementById('fare-mode-normal');
            const discountCheckbox = document.getElementById('fare-mode-discount');
            
            if (mode === 'normal') {
                if (normalCheckbox.checked) {
                    discountCheckbox.checked = false;
                    selectedFareMode = 'normal';
                } else {
                    selectedFareMode = '';
                }
            } else if (mode === 'discount') {
                if (discountCheckbox.checked) {
                    normalCheckbox.checked = false;
                    selectedFareMode = 'discount';
                } else {
                    selectedFareMode = '';
                }
            }
            updateFareModeDisplay();
        }

        function updateFareModeDisplay() {
            if (currentBaseFare <= 0) return;
            
            const normalFare = currentBaseFare + currentTunnelFee + selectedSurcharge;
            const discountedFare = Math.round((currentBaseFare + currentTunnelFee) * 0.85) + selectedSurcharge;
            
            document.getElementById('normal-fare-val').textContent = 'HK$ ' + normalFare;
            document.getElementById('discount-fare-val').textContent = 'HK$ ' + discountedFare;
        }

        function goToNextFromCar() {
            if (!selectedCar) {
                alert('請先選擇車款！');
                return;
            }
            
            if (selectedCar === '豐田混能的士' && !selectedFareMode) {
                alert('請選擇收費模式（正價或八五折優惠）！');
                return;
            }
            
            goToPage(4);
        }

        // ============================================
        // 預約模式
        // ============================================
        function setBookingMode(mode) {
            bookingMode = mode;
            const instantBtn = document.getElementById('btn-instant');
            const scheduledBtn = document.getElementById('btn-scheduled');
            const datetimeArea = document.getElementById('datetime-area');
            
            if (mode === 'instant') {
                instantBtn.className = 'bg-brand-yellow text-black font-bold py-3 rounded-xl';
                scheduledBtn.className = 'bg-gray-700 text-white font-bold py-3 rounded-xl';
                datetimeArea.classList.add('hidden');
            } else {
                scheduledBtn.className = 'bg-brand-yellow text-black font-bold py-3 rounded-xl';
                instantBtn.className = 'bg-gray-700 text-white font-bold py-3 rounded-xl';
                datetimeArea.classList.remove('hidden');
            }
        }

        // ============================================
        // 付款方式
        // ============================================
        function togglePaymentOptions() {
            document.getElementById('more-payment-options').classList.toggle('hidden');
        }

        // ============================================
        // 驗證碼
        // ============================================
        function sendVerificationCode() {
            const phone = document.getElementById('phone').value.trim();
            const cleanPhone = phone.replace(/\D/g, '');
            
            if (cleanPhone.length < 8) {
                alert('請先輸入正確電話號碼');
                return;
            }
            
            currentVerificationCode = Math.floor(100000 + Math.random() * 900000).toString();
            document.getElementById('verification_code').value = currentVerificationCode;
            
            document.getElementById('verification-code-display').classList.remove('hidden');
            document.getElementById('verification-code-value').textContent = currentVerificationCode;
            
            const link = document.getElementById('whatsapp-verify-link');
            const message = `我嘅預約驗證碼係：${currentVerificationCode}\n電話號碼：${phone}`;
            link.href = `https://wa.me/85268815441?text=${encodeURIComponent(message)}`;
            link.onclick = () => { whatsappSent = true; };
        }

        // ============================================
        // 提交預約
        // ============================================
        function submitBooking() {
            const phone = document.getElementById('phone').value.trim();
            const cleanPhone = phone.replace(/\D/g, '');
            
            if (cleanPhone.length < 8) {
                alert('請先輸入正確電話號碼');
                return;
            }
            
            const code = document.getElementById('verification_code').value.trim();
            
            if (code === INTERNAL_CODE) {
                // 內部人員
                console.log('內部人員提交');
            } else if (code === currentVerificationCode && whatsappSent) {
                // 一般客人驗證成功
                console.log('客人驗證成功');
            } else if (code === currentVerificationCode && !whatsappSent) {
                alert('請先發送 WhatsApp 確認訊息！');
                return;
            } else {
                alert('請先完成電話驗證！');
                return;
            }
            
            // 建立訂單資料
            const pickup = document.getElementById('calc-pickup').value.trim();
            const dropoff = document.getElementById('calc-dropoff').value.trim();
            const date = document.getElementById('date').value;
            const time = document.getElementById('time').value;
            const passengers = document.getElementById('passengers').value;
            const luggages = document.getElementById('luggages').value;
            const hasPet = document.getElementById('has_pet').checked;
            const hasWheelchair = document.getElementById('has_wheelchair').checked;
            const surname = document.getElementById('contact_surname').value.trim();
            const title = document.getElementById('contact_title').value;
            const payments = [...document.querySelectorAll('input[name="payment_method"]:checked')].map(el => el.value).join(' / ');
            
            const bookingData = {
                pickup, dropoff, date, time, passengers, luggages, hasPet, hasWheelchair,
                surname, title, phone, paymentMethod: payments,
                carType: selectedCar,
                totalFare: currentBaseFare + currentTunnelFee + selectedSurcharge,
                feeMode: selectedFareMode === 'discount' ? '八五折優惠' : '正價按錶收費',
                surcharge: selectedSurcharge,
                tunnelFee: currentTunnelFee,
                isInternalBooking: code === INTERNAL_CODE
            };
            
            // 發送到後端
            fetch('/.netlify/functions/booking', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(bookingData)
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    document.getElementById('booking-success-message').classList.remove('hidden');
                    document.getElementById('booking-success-message').scrollIntoView({ behavior: 'smooth', block: 'center' });
                } else {
                    document.getElementById('booking-error-message').classList.remove('hidden');
                }
            })
            .catch(err => {
                console.error(err);
                document.getElementById('booking-error-message').classList.remove('hidden');
            });
        }

        // ============================================
        // WeChat
        // ============================================
        function showWeComQR() { document.getElementById('wecom-modal').classList.remove('hidden'); }
        function closeWeComQR() { document.getElementById('wecom-modal').classList.add('hidden'); }

        // ============================================
        // 語音辨識（簡化版）
        // ============================================
        function startVoiceRecognition() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) { alert('瀏覽器不支援語音辨識'); return; }
            
            const recognition = new SpeechRecognition();
            recognition.lang = 'zh-HK';
            recognition.onresult = (event) => {
                const speechResult = event.results[0][0].transcript;
                // 簡單處理
                alert('聽到：' + speechResult);
            };
            recognition.start();
        }

        // ============================================
        // 初始化
        // ============================================
        function initAutocomplete() {
            const hkBounds = new google.maps.LatLngBounds(
                new google.maps.LatLng(22.15, 113.83),
                new google.maps.LatLng(22.58, 114.50)
            );
            const options = {
                bounds: hkBounds,
                componentRestrictions: { country: "hk" },
                fields: ["formatted_address", "geometry", "name"]
            };
            
            const pickupEl = document.getElementById('calc-pickup');
            const dropoffEl = document.getElementById('calc-dropoff');
            if (pickupEl) new google.maps.places.Autocomplete(pickupEl, options);
            if (dropoffEl) new google.maps.places.Autocomplete(dropoffEl, options);
            
            for (let i = 1; i <= 3; i++) {
                const stopEl = document.getElementById(`calc-stopover-${i}`);
                if (stopEl) new google.maps.places.Autocomplete(stopEl, options);
            }
        }

        // 初始化
        renderCarList();
        setBookingMode('scheduled');
        
        // 設定日期預設值
        const now = new Date();
        const year = now.getFullYear();
        const month = String(now.getMonth() + 1).padStart(2, '0');
        const day = String(now.getDate()).padStart(2, '0');
        const hours = String(now.getHours()).padStart(2, '0');
        const minutes = String(now.getMinutes()).padStart(2, '0');
        document.getElementById('date').value = `${year}-${month}-${day}`;
        document.getElementById('time').value = `${hours}:${minutes}`;

        // ============================================
        // 語言切換
        // ============================================
        function toggleLanguage() {
            currentLang = currentLang === 'zh' ? 'en' : 'zh';
            document.getElementById('lang-toggle-btn').innerText = currentLang === 'zh' ? 'EN' : '繁';
            renderCarList();
        }
    </script>
</body>
