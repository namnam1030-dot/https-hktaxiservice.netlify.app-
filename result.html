<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>車費預計結果</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #0B0B0B; color: #ffffff; font-family: 'PingFang HK', sans-serif; }
        #map { width: 100%; height: 300px; }
    </style>
</head>
<body>

    <h1>路線規劃結果</h1>
    <div id="loading">正在計算...</div>
    <div id="content" style="display:none;">
        <div id="map"></div>
        <div id="route-info"></div>
    </div>

    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyA_96kRHBq2ydwohDfpmUhdDNIPOgZQSL0&libraries=places,geometry&language=zh-HK" async defer></script>
    <script>
        let map;
        let directionsService;
        let directionsRenderer;

        function initMap() {
            const routeData = JSON.parse(localStorage.getItem('taxiRouteData') || '{}');
            const pickup = routeData.pickup || '';
            const dropoff = routeData.dropoff || '';
            
            if (!pickup || !dropoff) {
                document.getElementById('loading').innerText = '未找到路線資料';
                return;
            }

            document.getElementById('loading').innerText = '起點: ' + pickup + ' → 終點: ' + dropoff;

            directionsService = new google.maps.DirectionsService();
            directionsRenderer = new google.maps.DirectionsRenderer();

            map = new google.maps.Map(document.getElementById('map'), {
                zoom: 12,
                center: { lat: 22.3193, lng: 114.1694 }
            });

            directionsRenderer.setMap(map);

            const request = {
                origin: pickup,
                destination: dropoff,
                travelMode: google.maps.TravelMode.DRIVING,
                provideRouteAlternatives: true
            };

            directionsService.route(request, (result, status) => {
                if (status === google.maps.DirectionsStatus.OK) {
                    directionsRenderer.setDirections(result);
                    document.getElementById('loading').style.display = 'none';
                    document.getElementById('content').style.display = 'block';
                    
                    const route = result.routes[0];
                    const leg = route.legs[0];
                    document.getElementById('route-info').innerHTML = 
                        '距離: ' + (leg.distance.value / 1000).toFixed(1) + ' km<br>' +
                        '時間: ' + Math.round(leg.duration.value / 60) + ' 分鐘';
                } else {
                    document.getElementById('loading').innerText = '計算失敗: ' + status;
                }
            });
        }
    </script>
</body>
</html>
