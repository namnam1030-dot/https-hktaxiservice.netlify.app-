<!DOCTYPE html>

<!-- ✅ 反黑閃：第一時間搶 paint（同主站一致） -->
<script>
(function() {
    var isLight = false;
    try {
        var saved = localStorage.getItem('taxiTheme');
        var override = localStorage.getItem('taxiThemeUserOverride') === '1';
        if (override && (saved === 'light' || saved === 'dark')) {
            isLight = saved === 'light';
        } else {
            isLight = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches;
        }
    } catch(e) {}

    var root = document.documentElement;
    root.classList.toggle('light-theme', isLight);
    root.style.backgroundColor = isLight ? '#FFFFFF' : '#0B0B0B';
    root.style.color           = isLight ? '#000000' : '#FFFFFF';
    root.style.colorScheme     = isLight ? 'light' : 'dark';
    root.setAttribute('data-theme', isLight ? 'light' : 'dark');

    if (isLight) {
        var obs = new MutationObserver(function() {
            if (document.body) {
                document.body.classList.add('light-theme');
                obs.disconnect();
            }
        });
        obs.observe(root, { childList: true });
    }
})();
</script>

<!-- 🔴 語言切換邏輯 + vcf 動態連結 -->
<script>
var currentLang = localStorage.getItem('taxiLang') || 'zh';

var translations = {
    zh: {
        brand_title: "24小時的士預約",
        brand_sub: "長途跨區・機場口岸接送<br>八五折的士 | 六座豪華的士",
        btn1_title: "加入電話簿",
        btn1_sub: "一鍵儲存「24小時的士預約」",
        btn2_title: "WhatsApp 叫車",
        btn2_sub: "即時對話・預約的士服務",
        btn3_title: "瀏覽網站",
        btn3_sub: "智能路線規劃・預計車費"
    },
    en: {
        brand_title: "24-Hour Taxi Booking",
        brand_sub: "Long Distance &amp; Cross-Border · Airport &amp; Border Transfers<br>15% Off Taxi | 6-Seater Luxury Taxi",
        btn1_title: "Add to Contacts",
        btn1_sub: 'Save "24-Hour Taxi Booking" with one tap',
        btn2_title: "Book via WhatsApp",
        btn2_sub: "Instant Chat · Taxi Booking Service",
        btn3_title: "Visit Website",
        btn3_sub: "Smart Route Planning · Fare Estimation"
    }
};

function applyLanguage() {
    var btn = document.getElementById('lang-toggle-btn');
    if (btn) btn.innerText = currentLang === 'zh' ? 'EN' : '繁';

    // 更新所有文字
    document.querySelectorAll('[data-i18n]').forEach(function(el) {
        var key = el.getAttribute('data-i18n');
        if (translations[currentLang] && translations[currentLang][key] !== undefined) {
            el.innerHTML = translations[currentLang][key];
        }
    });

    // 🔴 動態切換加入電話簿嘅 vcf 連結
    var vcfLink = document.getElementById('vcf-link');
    if (vcfLink) {
        vcfLink.href = currentLang === 'en' ? 'nam_en.vcf' : 'nam.vcf';
    }
}

function toggleLanguage() {
    currentLang = currentLang === 'zh' ? 'en' : 'zh';
    localStorage.setItem('taxiLang', currentLang);
    applyLanguage();
}

// 頁面載入時立即套用語言
document.addEventListener('DOMContentLoaded', function() {
    applyLanguage();
});
</script>
