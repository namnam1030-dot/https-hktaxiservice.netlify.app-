<meta name="theme-color" content="#FFF200">

<!-- ✅ 反黑閃：第一時間搶 paint（同主站一致） -->
<script>
(function() {
    var isLight = false;
    try {
        var saved = localStorage.getItem('taxiTheme');
        var override = localStorage.getItem('taxiThemeUserOverride') === '1';
        if (override && (saved === 'light' || saved === 'dark')) {
            isLight = saved === 'light';
        } else {
            isLight = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches;
        }
    } catch(e) {}

    var root = document.documentElement;
    root.classList.toggle('light-theme', isLight);
    root.style.backgroundColor = isLight ? '#FFFFFF' : '#0B0B0B';
    root.style.color           = isLight ? '#000000' : '#FFFFFF';
    root.style.colorScheme     = isLight ? 'light' : 'dark';
    root.setAttribute('data-theme', isLight ? 'light' : 'dark');

    if (isLight) {
        var obs = new MutationObserver(function() {
            if (document.body) {
                document.body.classList.add('light-theme');
                obs.disconnect();
            }
        });
        obs.observe(root, { childList: true });
    }
})();
</script>
