[build]
  functions = "netlify/functions"
  publish = "."
  command = "node -e \"const fs=require('fs');const v=Date.now();let s=fs.readFileSync('sw.js','utf8');s=s.replace(/__BUILD_VERSION__/g,v);fs.writeFileSync('sw.js',s);\""

[build.environment]
  NODE_VERSION = "18"

# =========================================================
# 全域 CORS
# =========================================================
[[headers]]
  for = "/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"

# =========================================================
# sw.js：絕對唔可以 cache
# =========================================================
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Pragma = "no-cache"
    Expires = "0"

# =========================================================
# 所有 HTML：每次檢查
# =========================================================
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# =========================================================
# theme.css / theme.js：每次檢查
# =========================================================
[[headers]]
  for = "/theme.css"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/theme.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# =========================================================
# 圖片：長 cache
# =========================================================
[[headers]]
  for = "/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*.jpeg"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*.ico"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=604800"